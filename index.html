<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="태양계">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>태양계 뽀모도로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&display=swap">
<style>
/* 레이아웃: 폰 세로 한 화면. 위 10% 상단바 / 중앙 65% 태양계 스테이지 / 아래 25% 정보와 조작 */
:root {
  --bg: #050505;
  --fg: #f4f4f5;
  --mute: rgba(255,255,255,.52);
  --dim: rgba(255,255,255,.3);
  --line: rgba(255,255,255,.14);
  --ring: rgba(255,255,255,.78);
  --btn: #e9e9eb;
  --btn-ink: #0a0a0a;
  --font: "Inter", -apple-system, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; background: var(--bg); color: var(--fg); }
body { font-family: var(--font); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { position: relative; height: 100%; max-width: 430px; margin: 0 auto; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-inline: 20px; padding-block: 8px 14px; opacity: 0; visibility: hidden; transition: opacity .4s linear, visibility 0s linear .4s; }
.screen.on { opacity: 1; visibility: visible; transition: opacity .4s linear, visibility 0s; }
.bar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; color: var(--mute); font-size: 12px; letter-spacing: .14em; }
.bar .icon { width: 36px; height: 36px; display: grid; place-items: center; background: none; border: 0; color: var(--mute); }
.bar .icon svg { width: 20px; height: 20px; }
.bar .title { color: var(--mute); }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.stage svg { width: 100%; height: 100%; display: block; overflow: visible; }
.hit { fill: transparent; cursor: pointer; }
.info { flex: none; text-align: center; padding-top: 6px; }
.eyebrow { font-size: 11px; letter-spacing: .2em; color: var(--mute); }
.name { margin: 10px 0 0; font-size: 32px; font-weight: 500; letter-spacing: .04em; }
.minrow { height: 36px; margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 15px; color: var(--mute); font-variant-numeric: tabular-nums; }
.step { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--fg); font-size: 18px; line-height: 1; display: grid; place-items: center; }
.step[hidden] { display: none; }
.minrow .ghost { width: 32px; height: 32px; }
.start { width: 100%; height: 56px; margin-top: 14px; border: 0; border-radius: 28px; background: var(--btn); color: var(--btn-ink); font-size: 17px; font-weight: 500; }
.credit { margin-top: 12px; font-size: 11px; color: var(--dim); letter-spacing: .06em; }
.timer { flex: none; text-align: center; }
.time { font-size: 68px; font-weight: 100; letter-spacing: .01em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.status { margin-top: 8px; font-size: 15px; font-weight: 300; color: var(--mute); }
.ftitle { flex: none; text-align: center; padding-top: 14px; }
.ftitle b { display: block; font-weight: 300; font-size: 14px; letter-spacing: .34em; padding-left: .34em; }
.ftitle i { display: block; width: 26px; height: 1px; background: rgba(255,255,255,.4); margin: 10px auto 12px; }
.ftitle span { display: block; font-size: 12px; font-weight: 300; letter-spacing: .3em; padding-left: .3em; color: var(--mute); }
.back { position: absolute; left: 10px; top: 10px; z-index: 2; width: 40px; height: 40px; display: grid; place-items: center; background: none; border: 0; color: var(--mute); }
.back svg { width: 22px; height: 22px; }
.stars { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.stars u { position: absolute; width: 1.5px; height: 1.5px; border-radius: 50%; background: #fff; }
.ctrls { flex: none; display: flex; justify-content: center; gap: 40px; margin-top: 22px; }
.ctrl { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); }
.circ { width: 60px; height: 60px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: none; display: grid; place-items: center; }
.circ svg { width: 20px; height: 20px; }
.circ[disabled] { opacity: .35; cursor: default; }
.preview { flex: none; margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--dim); letter-spacing: .08em; }
.preview input { flex: 1; min-width: 0; accent-color: #888; }
button:focus-visible, input:focus-visible { outline: 2px solid rgba(255,255,255,.7); outline-offset: 3px; }
@media (min-aspect-ratio: 1/1) and (min-width: 560px) {
  .app { max-width: 1100px; }
  .screen { justify-content: center; padding-left: calc(100% - 340px); padding-right: 20px; }
  .stage { position: absolute; left: 20px; right: 360px; top: 8px; bottom: 14px; flex: none; }
  .ftitle { padding-top: 0; }
  .start { margin-top: 18px; }
  .preview { margin-top: 18px; }
}
@media (min-aspect-ratio: 1/1) and (min-width: 560px) and (max-height: 470px) {
  .time { font-size: 54px; }
  .circ { width: 52px; height: 52px; }
  .ctrls { margin-top: 14px; }
  .name { font-size: 28px; margin-top: 6px; }
  .preview { margin-top: 12px; padding-top: 8px; }
  .ftitle i { margin: 8px auto; }
}
@media (prefers-reduced-motion: reduce) { .screen, .screen.on { transition: none; } }
html { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
.preview { display: none !important; }
</style>
</head>
<body>


<div class="app">
  <section class="screen on" id="scrSelect" aria-label="행성 선택">
    <div class="bar">
      <span>태양계 뽀모도로</span>
      <button class="icon" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="stage"><svg id="selSvg" viewBox="-18 -108 436 616" aria-label="태양계"></svg></div>
    <div class="info">
      <div class="eyebrow">SELECTED PLANET</div>
      <h1 class="name" id="selName">EARTH</h1>
      <div class="minrow">
        <button class="step" id="minMinus" type="button" aria-label="5분 줄이기" hidden>−</button>
        <span id="selMin">25 min</span>
        <button class="step" id="minPlus" type="button" aria-label="5분 늘리기" hidden>+</button>
      </div>
      <button class="start" id="btnStart" type="button">집중 시작</button>
      <div class="credit">Images: NASA</div>
    </div>
  </section>

  <section class="screen" id="scrFocus" aria-label="집중 실행">
    <div class="stars" id="stars" aria-hidden="true"></div>
    <button class="icon back" id="btnBack" type="button" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ftitle"><b>FOCUS</b><i></i><span id="focTitle">EARTH · 25 MIN</span></div>
    <div class="stage"><svg id="focSvg" viewBox="-12 -12 424 424" aria-label="공전 진행"></svg></div>
    <div class="timer">
      <div class="time" id="timeTxt">25:00</div>
      <div class="status" id="statusTxt">집중 중</div>
    </div>
    <div class="ctrls">
      <div class="ctrl">
        <button class="circ" id="btnStop" type="button" aria-label="종료">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
        </button><span>종료</span>
      </div>
      <div class="ctrl">
        <button class="circ" id="btnPause" type="button" aria-label="일시정지">
          <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="6" width="3.4" height="12" rx="1.2"/><rect x="13.6" y="6" width="3.4" height="12" rx="1.2"/></svg>
          <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M8 6.2v11.6a.8.8 0 0 0 1.2.7l9-5.8a.8.8 0 0 0 0-1.4l-9-5.8A.8.8 0 0 0 8 6.2z"/></svg>
        </button><span id="pauseLbl">일시정지</span>
      </div>
    </div>
    <div class="preview">
      <label for="scrub">미리보기 · 진행도</label>
      <input id="scrub" type="range" min="0" max="1000" value="0">
    </div>
  </section>
</div>

    var ar = $('arc'); if (ar) ar.setAttribute('d', pr >= 1 ? '' : (pr <= 0.0005 ? 'M' + CX + ',' + TOP + ' A' + R + ',' + R + ' 0 1 0 ' + CX + ',' + (CY + R) + ' A' + R + ',' + R + ' 0 1 0 ' + CX + ',' + TOP : 'M' + px.toFixed(2) + ',' + py.toFixed(2) + ' A' + R + ',' + R + ' 0 ' + ((1 - pr) > 0.5 ? 1 : 0) + ' 0 ' + CX + ',' + TOP));
    var ed = $('edge'); if (ed) { ed.setAttribute('x2', px.toFixed(2)); ed.setAttribute('y2', py.toFixed(2)); ed.style.display = pr >= 1 ? 'none' : ''; }
    var sec = Math.ceil((T - e) / 1000);
    if (sec !== lastSec) { lastSec = sec; $('timeTxt').textContent = fmt(T - e); }
    if (!dragging) $('scrub').value = Math.round(pr * 1000);
  }
  var raf = 0;
  function loop() { if (!$('scrFocus').classList.contains('on')) { raf = 0; return; } frame(); raf = requestAnimationFrame(loop); }

  function setHid(el, v) { el.toggleAttribute('hidden', !!v); }
  function ctrlState() {
    var showPause = running || done;
    setHid($('icoPause'), !showPause); setHid($('icoPlay'), showPause);
    $('pauseLbl').textContent = (!running && !done) ? '계속' : '일시정지';
    $('btnPause').disabled = done;
    $('btnPause').setAttribute('aria-label', running ? '일시정지' : '계속');
    $('statusTxt').textContent = done ? '집중 완료' : (running ? '집중 중' : '일시정지됨');
  }
  function show(id) {
    ['scrSelect', 'scrFocus'].forEach(function (s) { $(s).classList.toggle('on', s === id); });
  }
  function startFocus() {
    var p = byId[state.sel];
    $('focTitle').textContent = p.en + ' · ' + minutesOf(p) + ' MIN';
    buildFocus();
    base = 0; done = false; running = true; startedAt = Date.now(); lastSec = -1;
    ctrlState(); show('scrFocus'); frame();
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function stopFocus() { running = false; show('scrSelect'); }

  $('btnStart').addEventListener('click', startFocus);
    $('btnBack').addEventListener('click', stopFocus);
  $('btnStop').addEventListener('click', stopFocus);
  $('btnPause').addEventListener('click', function () {
    if (done) return;
    if (running) { base = elapsed(); running = false; } else { startedAt = Date.now(); running = true; }
    ctrlState();
  });
  var sc = $('scrub');
  sc.addEventListener('pointerdown', function () { dragging = true; });
  window.addEventListener('pointerup', function () { dragging = false; });
  sc.addEventListener('input', function () {
    base = (sc.value / 1000) * total(); startedAt = Date.now(); done = false; lastSec = -1;
    if (sc.value >= 1000) { base = total(); }
    ctrlState(); frame();
  });

  (function () {
    var s = '', seed = 7; function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var k = 0; k < 46; k++) s += '<u style="left:' + (rnd() * 100).toFixed(1) + '%;top:' + (rnd() * 100).toFixed(1) + '%;opacity:' + (.12 + rnd() * .38).toFixed(2) + '"></u>';
    $('stars').innerHTML = s;
  })();
  buildSelect(); select('earth');
})();
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
